<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, .2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #28a745;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .show-password {
            margin: 10px 0;
            font-size: 14px;
            color: #333;
        }

        .show-password input {
            margin-right: 8px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <form id="signupForm">

            <input type="text" id="name" placeholder="Full Name" required>

            <input type="email" id="email" placeholder="Enter Gmail" required>

            <input type="password" id="password" placeholder="Create Password" required>

            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

            <div class="show-password">
                <label>
                    <input type="checkbox" id="showPassword">
                    Show Passwords
                </label>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="sign-in.html">Sign in</a>
        </div>

    </div>

    <script src="api-config.js"></script>
    <script>

        const apiOrigin = window.AUTOHIRE_API_ORIGIN;
        const apiUrl = window.AUTOHIRE_API_URL;
        const landingPage = "index.html";

        fetch(`${apiUrl}/me`, { credentials: "include" }).then(response => {
            if (response.ok) window.location.href = landingPage;
        });

        document.getElementById("showPassword").addEventListener("change", function () {
            const type = this.checked ? "text" : "password";
            document.getElementById("password").type = type;
            document.getElementById("confirmPassword").type = type;
        });

        // Create Account
        document.getElementById("signupForm").addEventListener("submit", async function (e) {

            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (name === "" || email === "" || password === "" || confirmPassword === "") {
                alert("Please fill all fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (!response.ok) {
                    alert(data.message);
                    return;
                }
                window.location.href = data.redirect || landingPage;
            } catch (error) {
                const users = JSON.parse(localStorage.getItem("autoHireUsers") || "[]");
                if (users.some(user => user.email === email.toLowerCase())) {
                    alert("An account with this email already exists.");
                    return;
                }

                const user = {
                    id: crypto.randomUUID(),
                    name,
                    email: email.toLowerCase(),
                    password,
                    profile: { fullName: name, emailAddress: email.toLowerCase() }
                };
                users.push(user);
                localStorage.setItem("autoHireUsers", JSON.stringify(users));
                localStorage.setItem("autoHireProfile", JSON.stringify(user));
                localStorage.setItem("loggedInUser", JSON.stringify(user));
                window.location.href = landingPage;
            }
        });

    </script>
</body>

</html>
