<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - AutoHire RAG AI</title>

    <script src="api-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-yellow: #eab308;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(56, 189, 248, 0.15);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "DM Sans", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        #bg3dCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.22;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -150px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(40px, -30px); }
        }

        .profile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-3d);
            backdrop-filter: blur(24px);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s var(--ease-out);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.35);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #a855f7);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 42px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 0 30px var(--primary-glow);
            border: 3px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        h2 {
            font-family: "Space Grotesk", sans-serif;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .role-tag {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .info-group {
            text-align: left;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-card {
            background: rgba(15, 23, 42, 0.8);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .info-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .info-card label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
        }

        .info-card input, .info-card select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .info-card select option {
            background: #0f172a;
            color: var(--text-main);
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-save {
            background: linear-gradient(135deg, #0284c7 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        .btn-save:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-switch {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .btn-switch:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .logout {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .logout:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 24px 18px;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 34px;
            }
            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <!-- 3D Canvas Mesh Background -->
    <canvas id="bg3dCanvas"></canvas>

    <!-- Ambient Glow Effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="profile-container 3d-card">
        <div class="status-badge" id="status-badge">
            <span id="status-dot">🟢</span> <span id="status-text">Auto Sync Active (Mobile Ready)</span>
        </div>

        <div class="avatar" id="avatar">U</div>

        <h2 id="display-name">Candidate User</h2>
        <p class="role-tag" id="display-domain">💻 Engineering & Computer Science</p>

        <form id="profile-form" onsubmit="saveProfile(event)">
            <div class="info-group">
                <div class="info-card">
                    <label>Full Name</label>
                    <input type="text" id="input-name" placeholder="Enter Full Name" required>
                </div>

                <div class="info-card">
                    <label>Email Address</label>
                    <input type="email" id="input-email" placeholder="Enter Email Address" required>
                </div>

                <div class="info-card">
                    <label>Target Domain / Field</label>
                    <select id="input-domain">
                        <option value="Engineering & Computer Science">💻 Engineering & Computer Science</option>
                        <option value="Arts, Design & Humanities">🎨 Arts, Design & Humanities</option>
                        <option value="Medical & Healthcare / Doctor">🩺 Medical & Healthcare / Doctor</option>
                        <option value="Pure & Applied Science / Research">🔬 Pure & Applied Science / Research</option>
                        <option value="Business, Finance & Commerce">💼 Business, Finance & Commerce</option>
                    </select>
                </div>

                <div class="info-card">
                    <label>Technical Skills</label>
                    <input type="text" id="input-skills" placeholder="e.g. Python, React, SQL, Git">
                </div>
            </div>

            <div class="btn-stack">
                <button type="submit" class="btn btn-save">
                    💾 Save Profile Changes
                </button>
                <button type="button" class="btn" onclick="goDashboard()">
                    🏠 Back to Dashboard
                </button>
                <button type="button" class="btn btn-secondary" onclick="goAnalyzer()">
                    📄 Resume Analyzer
                </button>
                <button type="button" class="btn btn-switch" onclick="switchAccount()">
                    🔄 Switch Account
                </button>
                <button type="button" class="btn logout" onclick="logout()">
                    🚪 Logout
                </button>
            </div>
        </form>
    </div>

    <script>
        // 1. Canvas 3D Particle Mesh
        (function init3DCanvas() {
            const canvas = document.getElementById("bg3dCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            const particles = [];
            const particleCount = Math.min(Math.floor(width / 24), 50);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? "rgba(56, 189, 248, 0.35)" : "rgba(168, 85, 247, 0.25)"
                });
            }

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // 2. 3D Tilt Hover Effect
        const profileCard = document.querySelector(".profile-container");
        if (profileCard) {
            profileCard.addEventListener("mousemove", (e) => {
                const rect = profileCard.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                profileCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            });

            profileCard.addEventListener("mouseleave", () => {
                profileCard.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
            });
        }

        // 3. Profile Initialization & Sync Logic
        const apiUrl = window.AUTOHIRE_API_URL || "http://127.0.0.1:8800/api/auth";

        function loadProfileData() {
            const localProfile = JSON.parse(localStorage.getItem("autoHireProfile") || localStorage.getItem("loggedInUser") || "null") || {
                name: "Candidate User",
                email: "candidate@autohire.ai",
                domain: "Engineering & Computer Science",
                skills: "Python, SQL, React, Git"
            };

            document.getElementById("input-name").value = localProfile.name || "Candidate User";
            document.getElementById("input-email").value = localProfile.email || "candidate@autohire.ai";
            document.getElementById("input-domain").value = localProfile.domain || "Engineering & Computer Science";
            document.getElementById("input-skills").value = localProfile.skills || "Python, SQL, React, Git";

            updateHeader(localProfile);

            fetch(`${apiUrl}/me`, { credentials: "include" })
                .then(async res => {
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.user) {
                            const merged = { ...localProfile, ...data.user };
                            document.getElementById("input-name").value = merged.name || merged.email;
                            document.getElementById("input-email").value = merged.email || "";
                            updateHeader(merged);
                            localStorage.setItem("autoHireProfile", JSON.stringify(merged));
                        }
                    }
                })
                .catch(() => {
                    document.getElementById("status-badge").style.background = "rgba(234, 179, 8, 0.15)";
                    document.getElementById("status-badge").style.color = "#facc15";
                    document.getElementById("status-text").innerText = "⚡ Local Auto-Sync (Offline Ready)";
                });
        }

        function updateHeader(user) {
            const name = user.name || user.fullName || user.email || "Candidate User";
            const email = user.email || user.emailAddress || "";
            const picture = user.picture || user.userAvatar || user.profilePic || (user.profile && user.profile.picture) || localStorage.getItem("userAvatar") || localStorage.getItem("profilePic") || "";

            document.getElementById("display-name").innerText = name;
            const googleSvg = `<svg width="40" height="40" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>`;

            const avatarEl = document.getElementById("avatar");
            if (avatarEl) {
                if (picture) {
                    avatarEl.innerHTML = `<img src="${picture}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Profile" onerror="this.onerror=null; this.parentElement.innerHTML='${googleSvg}';">`;
                } else {
                    avatarEl.innerHTML = googleSvg;
                }
            }
            document.getElementById("display-domain").innerText = user.domain ? user.domain : "💻 Engineering & Computer Science";
        }

        function saveProfile(event) {
            event.preventDefault();
            const profileData = {
                name: document.getElementById("input-name").value.trim(),
                email: document.getElementById("input-email").value.trim(),
                domain: document.getElementById("input-domain").value,
                skills: document.getElementById("input-skills").value.trim()
            };

            localStorage.setItem("autoHireProfile", JSON.stringify(profileData));
            localStorage.setItem("loggedInUser", JSON.stringify(profileData));
            updateHeader(profileData);

            alert("✅ Profile updated successfully!");
        }

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        function goAnalyzer() {
            window.location.href = "analyzer.html";
        }

        function switchAccount() {
            if (window.AutoHireAuth) {
                window.AutoHireAuth.logout(true);
            } else {
                localStorage.removeItem("loggedInUser");
                localStorage.removeItem("autoHireProfile");
                window.location.href = "sign-in.html?switch=true";
            }
        }

        function logout() {
            if (window.AutoHireAuth) {
                window.AutoHireAuth.logout(false);
            } else {
                fetch(`${apiUrl}/logout`, { method: "POST", credentials: "include" }).finally(() => {
                    localStorage.removeItem("loggedInUser");
                    localStorage.removeItem("autoHireProfile");
                    window.location.href = "sign-in.html";
                });
            }
        }

        window.addEventListener("DOMContentLoaded", loadProfileData);
    </script>
</body>

</html>
