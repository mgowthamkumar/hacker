<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - AutoHire RAG AI</title>

    <script src="api-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-yellow: #eab308;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(56, 189, 248, 0.15);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "DM Sans", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        #bg3dCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.22;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -150px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(40px, -30px); }
        }

        .profile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-3d);
            backdrop-filter: blur(24px);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s var(--ease-out);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.35);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #a855f7);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 42px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 0 30px var(--primary-glow);
            border: 3px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        h2 {
            font-family: "Space Grotesk", sans-serif;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .role-tag {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .info-group {
            text-align: left;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-card {
            background: rgba(15, 23, 42, 0.8);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .info-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .info-card label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
        }

        .info-card input, .info-card select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .info-card select option {
            background: #0f172a;
            color: var(--text-main);
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-save {
            background: linear-gradient(135deg, #0284c7 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        .btn-save:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-switch {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .btn-switch:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .logout {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .logout:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 24px 18px;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 34px;
            }
            h2 {
                font-size: 22px;
            }
        }

        /* ── Social Badges & GitHub Integration ── */
        .social-badges-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .social-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 15px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s var(--ease-out);
            backdrop-filter: blur(10px);
        }
        .github-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .github-badge:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            transform: translateY(-2px);
        }
        .linkedin-badge {
            background: rgba(10, 102, 194, 0.18);
            color: #38bdf8;
            border: 1px solid rgba(10, 102, 194, 0.4);
        }
        .linkedin-badge:hover {
            background: rgba(10, 102, 194, 0.32);
            color: #fff;
            box-shadow: 0 0 16px rgba(10, 102, 194, 0.4);
            transform: translateY(-2px);
        }

        .input-with-action {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-with-action input {
            flex: 1;
        }
        .btn-verify-sm {
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.2);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-verify-sm:hover {
            background: rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .verification-status-box {
            margin-top: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .verification-status-box.active {
            display: flex;
        }
        .verification-status-box.verified {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #4ade80;
        }
        .verification-status-box.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
        }

        /* ── Featured Projects Section ── */
        .projects-section {
            margin-top: 24px;
            text-align: left;
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
        }
        .projects-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .projects-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-pick-repos {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-pick-repos:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .project-card-item {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, transform 0.2s;
        }
        .project-card-item:hover {
            border-color: var(--primary);
            transform: translateX(2px);
        }
        .project-card-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .project-card-name {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .project-card-name:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        .project-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 380px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* ── Expandable Repo Picker Container ── */
        .repo-picker-box {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-top: 14px;
            max-height: 320px;
            overflow-y: auto;
        }
        .repo-picker-box.active {
            display: block;
        }
        .repo-pick-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }
        .repo-pick-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .repo-pick-item.selected {
            background: rgba(0, 255, 65, 0.08);
            border-color: rgba(0, 255, 65, 0.2);
        }
    </style>
</head>

    <div class="profile-container 3d-card" style="max-width: 620px;">

                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>

                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9h2.77v8.37H6.46v-8.37M7.85 6.4a1.63 1.63 0 1 0 0 3.26 1.63 1.63 0 0 0 0-3.26z"/></svg>

        <form id="profile-form" onsubmit="saveProfile(event)">

    <script src="github-profile-service.js"></script>
    <script>
        // 1. Canvas 3D Particle Mesh
        (function init3DCanvas() {
            const canvas = document.getElementById("bg3dCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            const particles = [];
            const particleCount = Math.min(Math.floor(width / 24), 50);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? "rgba(56, 189, 248, 0.35)" : "rgba(168, 85, 247, 0.25)"
                });
            }

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // 2. 3D Tilt Hover Effect
        const profileCard = document.querySelector(".profile-container");
        if (profileCard) {
            profileCard.addEventListener("mousemove", (e) => {
                const rect = profileCard.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                profileCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            });

            profileCard.addEventListener("mouseleave", () => {
                profileCard.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
            });
        }

        // 3. Profile State & Initialization Logic
        const apiUrl = window.AUTOHIRE_API_URL || "http://127.0.0.1:8800/api/auth";
        let currentProfileProjects = [];
        let fetchedGitHubRepos = [];

        function loadProfileData() {
            const localUser = JSON.parse(localStorage.getItem("autoHireProfile") || localStorage.getItem("loggedInUser") || "null") || {};
            const profile = localUser.profile || localUser;

            document.getElementById("input-name").value = profile.fullName || profile.name || "Candidate User";
            document.getElementById("input-email").value = profile.emailAddress || profile.email || "candidate@autohire.ai";
            document.getElementById("input-domain").value = profile.domain || profile.preferredDomain || "Engineering & Computer Science";
            document.getElementById("input-skills").value = profile.skills || "Python, SQL, React, Git";

            if (profile.githubProfile) {
                document.getElementById("input-github").value = profile.githubProfile;
            }
            if (profile.linkedinProfile) {
                document.getElementById("input-linkedin").value = profile.linkedinProfile;
            }

            currentProfileProjects = Array.isArray(profile.projects) ? profile.projects : [];

            updateHeader(profile);
            updateSocialBadges(profile);
            updateProfileLinkedInDisplay();
            renderProfileProjects();

            if (profile.githubProfile) {
                verifyGitHubInProfile(false);
            }

            if (window.AutoHireDeviceAuth) {
                window.AutoHireDeviceAuth.renderTrustedDevicesSection();
            }

            // Sync from backend if running
            fetch(`${apiUrl}/me`, { credentials: "include" })
                .then(async res => {
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.user) {
                            const merged = { ...profile, ...data.user };
                            document.getElementById("input-name").value = merged.name || merged.fullName || merged.email;
                            document.getElementById("input-email").value = merged.email || merged.emailAddress || "";
                            updateHeader(merged);
                            updateSocialBadges(merged);
                        }
                    }
                })
                .catch(() => {
                    document.getElementById("status-badge").style.background = "rgba(234, 179, 8, 0.15)";
                    document.getElementById("status-badge").style.color = "#facc15";
                    document.getElementById("status-text").innerText = "⚡ Local Auto-Sync (Offline Ready)";
                });
        }

        function updateHeader(user) {
            const name = user.fullName || user.name || user.email || "Candidate User";
            const picture = user.picture || user.userAvatar || user.profilePic || (user.profile && user.profile.picture) || localStorage.getItem("userAvatar") || localStorage.getItem("profilePic") || "";

            document.getElementById("display-name").innerText = name;
            const googleSvg = `<svg width="40" height="40" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>`;

            const avatarEl = document.getElementById("avatar");
            if (avatarEl) {
                if (picture) {
                    avatarEl.innerHTML = `<img src="${picture}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Profile" onerror="this.onerror=null; this.parentElement.innerHTML='${googleSvg}';">`;
                } else {
                    avatarEl.innerHTML = googleSvg;
                }
            }
            document.getElementById("display-domain").innerText = user.domain || user.preferredDomain || "💻 Engineering & Computer Science";
        }

        // 4. Update Clickable Social Badges (Direct navigation to GitHub & LinkedIn profiles)
        function updateSocialBadges(profile) {
            const ghBadge = document.getElementById("badge-github");
            const ghText = document.getElementById("badge-github-text");
            const liBadge = document.getElementById("badge-linkedin");
            const liText = document.getElementById("badge-linkedin-text");

            const rawGh = profile.githubProfile || document.getElementById("input-github").value.trim();
            const ghUsername = AutoHireGitHub.extractGitHubUsername(rawGh);
            if (ghUsername) {
                ghBadge.href = `https://github.com/${ghUsername}`;
                ghText.textContent = `@${ghUsername}`;
                ghBadge.style.display = "inline-flex";
            } else {
                ghBadge.style.display = "none";
            }

            const rawLi = profile.linkedinProfile || document.getElementById("input-linkedin").value.trim();
            const liUsername = AutoHireGitHub.extractLinkedInUsername(rawLi);
            const canonicalLi = AutoHireGitHub.formatLinkedInUrl(rawLi);
            if (canonicalLi && liUsername) {
                liBadge.href = canonicalLi;
                liText.textContent = `LinkedIn (${liUsername})`;
                liBadge.style.display = "inline-flex";
            } else {
                liBadge.style.display = "none";
            }
        }

        function updateProfileLinkedInDisplay() {
            const raw = document.getElementById("input-linkedin").value.trim();
            const previewEl = document.getElementById("profile-li-preview");
            const canonical = AutoHireGitHub.formatLinkedInUrl(raw);
            const username = AutoHireGitHub.extractLinkedInUsername(raw);

            if (canonical && username) {
                previewEl.innerHTML = `
                    <a href="${canonical}" target="_blank" rel="noopener noreferrer" style="color:var(--primary); font-size:12px; font-weight:700; text-decoration:none;">
                        💼 Open Profile (in/${username}) ↗
                    </a>
                `;
            } else {
                previewEl.innerHTML = "";
            }
            updateSocialBadges({ linkedinProfile: raw });
        }

        // 5. Live GitHub Verification inside Profile
        async function verifyGitHubInProfile(showLoading = true) {
            const input = document.getElementById("input-github");
            const statusBox = document.getElementById("profile-gh-status");
            const rawVal = input.value.trim();

            if (!rawVal) {
                statusBox.className = "verification-status-box";
                statusBox.style.display = "none";
                updateSocialBadges({});
                return;
            }

            const username = AutoHireGitHub.extractGitHubUsername(rawVal);
            if (!username) {
                statusBox.className = "verification-status-box error active";
                statusBox.innerHTML = `<span>⚠️ Please enter a valid GitHub username or URL.</span>`;
                return;
            }

            input.value = `https://github.com/${username}`;

            if (showLoading) {
                statusBox.className = "verification-status-box active";
                statusBox.style.background = "rgba(56, 189, 248, 0.1)";
                statusBox.style.color = "var(--primary)";
                statusBox.innerHTML = `<span>⏳ Verifying GitHub @${username}...</span>`;
            }

            const result = await AutoHireGitHub.verifyGitHubUser(username);

            if (result.success && result.exists) {
                statusBox.className = "verification-status-box verified active";
                statusBox.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>✅</span>
                        <div>
                            <strong>@${result.username}</strong> verified (${result.publicRepos} repos, ${result.followers} followers)
                            <a href="${result.profileUrl}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8; margin-left:6px; font-weight:700;">Open Profile ↗</a>
                        </div>
                    </div>
                `;

                // Update Avatar if currently default
                if (result.avatar) {
                    const avatarEl = document.getElementById("avatar");
                    if (avatarEl && !avatarEl.querySelector("img")) {
                        avatarEl.innerHTML = `<img src="${result.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Profile">`;
                    }
                }

                updateSocialBadges({ githubProfile: result.profileUrl });
            } else {
                statusBox.className = "verification-status-box error active";
                statusBox.innerHTML = `<span>❌ ${result.error || `User "@${username}" not found on GitHub.`}</span>`;
            }
        }

        // 6. Featured Projects Display & Interactive GitHub Repos Picker
        function renderProfileProjects() {
            const listEl = document.getElementById("profile-projects-list");
            if (!listEl) return;

            if (currentProfileProjects.length === 0) {
                listEl.innerHTML = `
                    <div style="padding:14px; background:rgba(255,255,255,0.03); border:1px dashed var(--card-border); border-radius:10px; color:var(--text-muted); font-size:13px; text-align:center;">
                        No featured GitHub projects selected yet. Click <strong>"Select from GitHub Repos"</strong> above to showcase your repositories!
                    </div>
                `;
                return;
            }

            listEl.innerHTML = currentProfileProjects.map((p, idx) => {
                const color = p.languageColor || AutoHireGitHub.LANGUAGE_COLORS[p.language] || "#38bdf8";
                return `
                    <div class="project-card-item">
                        <div class="project-card-left">
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="project-card-name" title="Click to view repository on GitHub">
                                <span>📦</span> ${p.name} ↗
                            </a>
                            <div class="project-card-desc">${p.description || "GitHub Repository"}</div>
                        </div>
                        <div class="project-card-meta">
                            <span style="display:inline-flex; align-items:center; gap:5px;">
                                <span style="width:8px; height:8px; border-radius:50%; background:${color};"></span>
                                ${p.language || "Code"}
                            </span>
                            <span>⭐ ${p.stars || 0}</span>
                            <button type="button" onclick="removeProject(${idx})" style="background:none; border:none; color:#f87171; font-size:14px; cursor:pointer; padding:2px 6px;" title="Remove from featured">✕</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        window.removeProject = function(idx) {
            currentProfileProjects.splice(idx, 1);
            renderProfileProjects();
        };

        async function toggleRepoPicker() {
            const pickerBox = document.getElementById("profile-repo-picker");
            const btn = document.getElementById("btn-toggle-picker");

            if (pickerBox.classList.contains("active")) {
                pickerBox.classList.remove("active");
                btn.textContent = "📦 Select from GitHub Repos";
                return;
            }

            const rawGh = document.getElementById("input-github").value.trim();
            const username = AutoHireGitHub.extractGitHubUsername(rawGh);

            if (!username) {
                alert("Please enter and verify your GitHub username above before selecting repositories.");
                document.getElementById("input-github").focus();
                return;
            }

            pickerBox.classList.add("active");
            btn.textContent = "✕ Close Repo Picker";

            const container = document.getElementById("repo-picker-items");
            container.innerHTML = `<div style="text-align:center; padding:12px; color:var(--primary); font-size:13px;">Fetching public repositories from GitHub for @${username}...</div>`;

            fetchedGitHubRepos = await AutoHireGitHub.fetchGitHubRepos(username);

            if (fetchedGitHubRepos.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:12px; color:var(--text-muted); font-size:13px;">No public repositories found for @${username}.</div>`;
                return;
            }

            renderPickerItems();
        }

        function renderPickerItems() {
            const container = document.getElementById("repo-picker-items");
            container.innerHTML = fetchedGitHubRepos.map(repo => {
                const isSelected = currentProfileProjects.some(p => p.url === repo.url);
                return `
                    <div class="repo-pick-item ${isSelected ? 'selected' : ''}" onclick="togglePickerRepo('${repo.url}')">
                        <div>
                            <div style="font-weight:700; font-size:13px; color:#fff; display:flex; align-items:center; gap:6px;">
                                <span>📦</span> ${repo.name}
                                <span style="font-size:11px; color:var(--primary);">${repo.language}</span>
                            </div>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${(repo.description || "").slice(0, 70)}</div>
                        </div>
                        <div style="font-size:12px; font-weight:700; color:${isSelected ? '#4ade80' : 'var(--text-muted)'};">
                            ${isSelected ? '✅ Added' : '+ Add'}
                        </div>
                    </div>
                `;
            }).join("");
        }

        window.togglePickerRepo = function(url) {
            const repo = fetchedGitHubRepos.find(r => r.url === url);
            if (!repo) return;

            const existingIdx = currentProfileProjects.findIndex(p => p.url === url);
            if (existingIdx >= 0) {
                currentProfileProjects.splice(existingIdx, 1);
            } else {
                currentProfileProjects.push(repo);
            }

            renderPickerItems();
            renderProfileProjects();
        };

        // 7. Save Profile Handler with Full Account Synchronization
        function saveProfile(event) {
            event.preventDefault();

            const rawGh = document.getElementById("input-github").value.trim();
            const rawLi = document.getElementById("input-linkedin").value.trim();

            const ghUsername = AutoHireGitHub.extractGitHubUsername(rawGh);
            const canonicalGh = AutoHireGitHub.formatGitHubUrl(rawGh);
            const liUsername = AutoHireGitHub.extractLinkedInUsername(rawLi);
            const canonicalLi = AutoHireGitHub.formatLinkedInUrl(rawLi);

            const profileData = {
                fullName: document.getElementById("input-name").value.trim(),
                name: document.getElementById("input-name").value.trim(),
                emailAddress: document.getElementById("input-email").value.trim().toLowerCase(),
                email: document.getElementById("input-email").value.trim().toLowerCase(),
                domain: document.getElementById("input-domain").value,
                preferredDomain: document.getElementById("input-domain").value,
                skills: document.getElementById("input-skills").value.trim(),
                githubProfile: canonicalGh,
                githubUsername: ghUsername,
                linkedinProfile: canonicalLi,
                linkedinUsername: liUsername,
                projects: currentProfileProjects
            };

            // Save in unified local storage and accounts list
            AutoHireGitHub.saveAccount(profileData, profileData);

            updateHeader(profileData);
            updateSocialBadges(profileData);
            renderProfileProjects();

            // Background sync with server if online
            const apiOrigin = window.AUTOHIRE_API_ORIGIN;
            fetch(`${apiOrigin}/api/profile`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(profileData)
            }).catch(() => { });

            alert("✅ Profile updated successfully!\nYour verified GitHub account, LinkedIn profile, and featured project repositories have been synchronized.");
        }

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        function goAnalyzer() {
            window.location.href = "analyzer.html";
        }

        function switchAccount() {
            if (window.AutoHireAuth) {
                window.AutoHireAuth.logout(true);
            } else {
                localStorage.removeItem("loggedInUser");
                localStorage.removeItem("autoHireProfile");
                window.location.href = "sign-in.html?switch=true";
            }
        }

        function logout() {
            if (window.AutoHireAuth) {
                window.AutoHireAuth.logout(false);
            } else {
                fetch(`${apiUrl}/logout`, { method: "POST", credentials: "include" }).finally(() => {
                    localStorage.removeItem("loggedInUser");
                    localStorage.removeItem("autoHireProfile");
                    window.location.href = "sign-in.html";
                });
            }
        }

        window.addEventListener("DOMContentLoaded", loadProfileData);
    </script>
</body>
</html>
