<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - AutoHire RAG AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .profile-container {
            width: 100%;
            max-width: 520px;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 28px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            margin-bottom: 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            font-size: 44px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
            border: 3px solid #fef08a;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .role-tag {
            color: #eab308;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .info-group {
            text-align: left;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-card {
            background: #0f172a;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .info-card label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .info-card input, .info-card select {
            width: 100%;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .info-card select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .info-card p {
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #eab308;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn:hover, .btn:active {
            background: #facc15;
            transform: translateY(-1px);
        }

        .btn-save {
            background: #10b981;
            color: #ffffff;
        }

        .btn-save:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .logout {
            background: #ef4444;
            color: #ffffff;
        }

        .logout:hover {
            background: #dc2626;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .profile-container {
                padding: 20px 16px;
                border-radius: 16px;
            }

            .avatar {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }

            h2 {
                font-size: 20px;
            }

            .btn {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <div class="status-badge" id="status-badge">
            <span id="status-dot">🟢</span> <span id="status-text">Auto Sync Active (Mobile Ready)</span>
        </div>

        <div class="avatar" id="avatar">
            U
        </div>

        <h2 id="display-name">Candidate User</h2>
        <p class="role-tag" id="display-domain">💻 Engineering & Computer Science</p>

        <form id="profile-form" onsubmit="saveProfile(event)">
            <div class="info-group">
                <div class="info-card">
                    <label>Full Name</label>
                    <input type="text" id="input-name" placeholder="Enter Full Name" required>
                </div>

                <div class="info-card">
                    <label>Email Address</label>
                    <input type="email" id="input-email" placeholder="Enter Email Address" required>
                </div>

                <div class="info-card">
                    <label>Target Domain / Field</label>
                    <select id="input-domain">
                        <option value="Engineering & Computer Science">💻 Engineering & Computer Science</option>
                        <option value="Arts, Design & Humanities">🎨 Arts, Design & Humanities</option>
                        <option value="Medical & Healthcare / Doctor">🩺 Medical & Healthcare / Doctor</option>
                        <option value="Pure & Applied Science / Research">🔬 Pure & Applied Science / Research</option>
                        <option value="Business, Finance & Commerce">💼 Business, Finance & Commerce</option>
                    </select>
                </div>

                <div class="info-card">
                    <label>Technical Skills</label>
                    <input type="text" id="input-skills" placeholder="e.g. Python, React, SQL, Git">
                </div>
            </div>

            <div class="btn-stack">
                <button type="submit" class="btn btn-save">
                    💾 Save Profile Changes
                </button>
                <button type="button" class="btn" onclick="goDashboard()">
                    🏠 Back to Dashboard
                </button>
                <button type="button" class="btn btn-secondary" onclick="goAnalyzer()">
                    📄 Resume Analyzer
                </button>
                <button type="button" class="btn logout" onclick="logout()">
                    🚪 Logout
                </button>
            </div>
        </form>
    </div>

    <script src="api-config.js"></script>
    <script>
        const apiUrl = window.AUTOHIRE_API_URL || "http://127.0.0.1:8800/api/auth";

        // Load profile automatically without terminal process requirement
        function loadProfileData() {
            const localProfile = JSON.parse(localStorage.getItem("autoHireProfile") || localStorage.getItem("loggedInUser") || "null") || {
                name: "Candidate User",
                email: "candidate@autohire.ai",
                domain: "Engineering & Computer Science",
                skills: "Python, SQL, React, Git"
            };

            // Populate Form UI
            document.getElementById("input-name").value = localProfile.name || "Candidate User";
            document.getElementById("input-email").value = localProfile.email || "candidate@autohire.ai";
            document.getElementById("input-domain").value = localProfile.domain || "Engineering & Computer Science";
            document.getElementById("input-skills").value = localProfile.skills || "Python, SQL, React, Git";

            updateHeader(localProfile);

            // Attempt live backend fetch seamlessly
            fetch(`${apiUrl}/me`, { credentials: "include" })
                .then(async res => {
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.user) {
                            const merged = { ...localProfile, ...data.user };
                            document.getElementById("input-name").value = merged.name || merged.email;
                            document.getElementById("input-email").value = merged.email || "";
                            updateHeader(merged);
                            localStorage.setItem("autoHireProfile", JSON.stringify(merged));
                        }
                    }
                })
                .catch(() => {
                    // Backend offline — local offline sync mode remains 100% active
                    document.getElementById("status-badge").style.background = "rgba(234, 179, 8, 0.15)";
                    document.getElementById("status-badge").style.color = "#facc15";
                    document.getElementById("status-text").innerText = "⚡ Local Auto-Sync (Offline Ready)";
                });
        }

        function updateHeader(user) {
            const name = user.name || user.fullName || user.email || "Candidate User";
            const email = user.email || user.emailAddress || "";
            const picture = user.picture || user.userAvatar || user.profilePic || (user.profile && user.profile.picture) || localStorage.getItem("userAvatar") || localStorage.getItem("profilePic") || "";

            document.getElementById("display-name").innerText = name;
            const googleSvg = `<svg width="40" height="40" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>`;

            const avatarEl = document.getElementById("avatar");
            if (avatarEl) {
                if (picture) {
                    avatarEl.innerHTML = `<img src="${picture}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Profile" onerror="this.onerror=null; this.parentElement.innerHTML='${googleSvg}';">`;
                } else {
                    avatarEl.innerHTML = googleSvg;
                }
            }
            document.getElementById("display-domain").innerText = user.domain ? user.domain : "💻 Engineering & Computer Science";
        }

        function saveProfile(event) {
            event.preventDefault();
            const profileData = {
                name: document.getElementById("input-name").value.trim(),
                email: document.getElementById("input-email").value.trim(),
                domain: document.getElementById("input-domain").value,
                skills: document.getElementById("input-skills").value.trim()
            };

            localStorage.setItem("autoHireProfile", JSON.stringify(profileData));
            localStorage.setItem("loggedInUser", JSON.stringify(profileData));
            updateHeader(profileData);

            alert("✅ Profile updated successfully!");
        }

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        function goAnalyzer() {
            window.location.href = "analyzer.html";
        }

        function logout() {
            fetch(`${apiUrl}/logout`, { method: "POST", credentials: "include" }).finally(() => {
                localStorage.removeItem("loggedInUser");
                localStorage.removeItem("autoHireProfile");
                window.location.href = "sign-in.html";
            });
        }

        // Auto-run profile initialization on load
        window.addEventListener("DOMContentLoaded", loadProfileData);
    </script>
</body>

</html>
