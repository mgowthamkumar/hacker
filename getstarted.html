<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore real Jobs, Internships, and Hackathons from top sources powered by AI.">
    <title>Opportunities Hub | AutoHire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b14;
            --surface: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --green: #00ff41;
            --green-glow: rgba(0, 255, 65, 0.25);
            --purple: #a855f7;
            --cyan: #38bdf8;
            --purple-dim: rgba(168, 85, 247, 0.15);
            --text: #f8fafc;
            --muted: #94a3b8;
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 10% 0%, rgba(0, 255, 65, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 90% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
            background-attachment: fixed;
            color: var(--text);
            padding: 24px;
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Scanline texture */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            padding: 20px 0 36px;
            animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        .header h1 {
            font: 800 clamp(1.8rem, 4vw, 2.8rem) "Space Grotesk", sans-serif;
            color: #fff;
            letter-spacing: -.04em;
            margin-bottom: 8px;
        }

        .header span { color: var(--green); text-shadow: 0 0 12px var(--green-glow); }

        .header p {
            color: var(--muted);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* ── LAYOUT ── */
        .layout-container {
            display: flex;
            max-width: 1240px;
            margin: 0 auto;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 28%;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 26px;
            border-radius: 20px;
            height: fit-content;
            border: 1px solid var(--border);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            position: sticky;
            top: 20px;
            animation: fadeUp 0.7s var(--ease-out) 0.1s both;
        }

        .sidebar h3 {
            margin-bottom: 20px;
            color: #fff;
            font: 700 1.05rem "Space Grotesk", sans-serif;
            letter-spacing: -.02em;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group { margin-bottom: 18px; }

        .filter-group label {
            display: block;
            margin-bottom: 6px;
            font-size: .8rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text);
            font: 500 .9rem "Inter", sans-serif;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            appearance: none;
            -webkit-appearance: none;
        }
        .filter-group select option { background: #1a2235; }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.2);
        }

        /* ── JOBS LIST ── */
        .jobs-list {
            width: 72%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ── JOB CARD ── */
        .job-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 26px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: transform 0.35s var(--ease-spring),
                        box-shadow 0.35s var(--ease-out),
                        border-color 0.3s;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.5s var(--ease-out) both;
        }

        /* Top accent line on hover */
        .job-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--purple), #6366f1);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--ease-out);
        }
        .job-card:hover::before { transform: scaleX(1); }

        .job-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(168,85,247,0.2);
            border-color: rgba(168,85,247,0.35);
            background: rgba(30, 41, 59, 0.7);
        }

        .ribbon {
            position: absolute;
            top: 15px;
            right: -35px;
            background: #eab308;
            color: #000;
            padding: 5px 40px;
            font: 700 .75rem "Inter", sans-serif;
            transform: rotate(45deg);
        }

        .ribbon.devpost { background: var(--purple); color: #fff; }
        .ribbon.devfolio { background: #3730a3; color: #fff; }
        .ribbon.hackerearth { background: #15803d; color: #fff; }
        .ribbon.intern { background: #3b82f6; color: #fff; }

        .company-name {
            color: var(--purple);
            font: 700 .8rem "Inter", sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .job-title {
            font: 700 1.3rem "Space Grotesk", sans-serif;
            color: #fff;
            margin-bottom: 16px;
            padding-right: 40px;
            letter-spacing: -.02em;
            line-height: 1.3;
        }

        .tags-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(51,65,85,0.8);
            padding: 5px 12px;
            border-radius: 100px;
            font-size: .8rem;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .tag.package {
            background: rgba(5,150,105,0.2);
            color: #34d399;
            border-color: rgba(5,150,105,0.3);
            font-weight: 600;
        }

        .tag.domain {
            background: rgba(37,99,235,0.2);
            color: #93c5fd;
            border-color: rgba(37,99,235,0.3);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 16px;
            margin-top: 12px;
        }

        .location {
            color: var(--muted);
            font-size: .85rem;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .apply-btn {
            background: rgba(168,85,247,0.15);
            color: var(--purple);
            border: 1px solid rgba(168,85,247,0.4);
            padding: 9px 20px;
            border-radius: 10px;
            font: 600 .88rem "Inter", sans-serif;
            cursor: pointer;
            transition: background 0.25s, transform 0.25s var(--ease-spring), box-shadow 0.25s;
            text-decoration: none;
            display: inline-block;
        }

        .apply-btn:hover {
            background: var(--purple);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168,85,247,0.35);
        }

        .bookmark-btn {
            background: rgba(51,65,85,0.6);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 9px 14px;
            border-radius: 10px;
            font: 500 .85rem "Inter", sans-serif;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .bookmark-btn:hover { background: rgba(51,65,85,0.9); color: #fff; transform: scale(1.05); }

        .bookmark-btn.saved {
            background: rgba(234,179,8,0.15);
            color: #eab308;
            border-color: rgba(234,179,8,0.3);
        }

        .no-results {
            text-align: center;
            padding: 50px 40px;
            background: rgba(30,41,59,0.5);
            border-radius: 16px;
            color: var(--muted);
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .no-results h3 { font: 600 1.1rem "Space Grotesk", sans-serif; color: var(--text); }

        @media(max-width: 768px) {
            .layout-container { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
            .jobs-list { width: 100%; }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Explore <span>Multi-Source Hackathons</span>, Internships & Jobs</h1>
        <p>The Opportunity To Build Yourself</p>
    </div>

    <div class="layout-container">

        <div class="sidebar">
            <h3>Search & Filters</h3>

            <div class="filter-group">
                <label for="search-input">Search Keywords</label>
                <input type="text" id="search-input" placeholder="e.g. AI, Devfolio, React...">
            </div>

            <div class="filter-group">
                <label for="type-filter">Opportunity Type</label>
                <select id="type-filter">
                    <option value="all">All Opportunities</option>
                    <option value="hackathons">🏆 All Hackathons</option>
                    <option value="jobs">💼 Full-Time Jobs</option>
                    <option value="internships">🎓 Internships</option>
                    <option value="companies">🏢 Company Career Pages</option>
                    <option value="saved">⭐ Saved / Bookmarked</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="domain-filter">Domain</label>
                <select id="domain-filter">
                    <option value="all">All Domains</option>
                    <option value="backend">Backend Development</option>
                    <option value="frontend">Frontend Development</option>
                    <option value="ai">Data Science / AI</option>
                    <option value="cybersecurity">Cybersecurity</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="location-filter">Location / Work Mode</label>
                <select id="location-filter">
                    <option value="all">All Locations</option>
                    <option value="remote">Remote / Online Only</option>
                    <option value="onsite">On-Site / Hybrid</option>
                </select>
            </div>
        </div>

        <div class="jobs-list" id="jobs-container"></div>

    </div>

    <script>
        const container = document.getElementById('jobs-container');
        const searchInput = document.getElementById('search-input');
        const typeFilter = document.getElementById('type-filter');
        const domainFilter = document.getElementById('domain-filter');
        const locationFilter = document.getElementById('location-filter');

        let allData = [];
        let savedIds = JSON.parse(localStorage.getItem('saved_multi_opps') || '[]');

        const fallbackHackathons = [
            {
                id: "devpost-fb-1",
                type: "hackathons",
                domain: "ai",
                isRemote: true,
                ribbonText: "Devpost",
                ribbonClass: "devpost",
                company: "DEVPOST HACKATHON",
                title: "Generative AI & Agentic Innovation Hackathon",
                typeTag: "🏆 Devpost Hackathon",
                domainTag: "🧠 Artificial Intelligence",
                packageTag: "💰 $25,000 Prize Pool",
                extraTag: "🌐 Online Entry",
                location: "📍 Global / Virtual",
                buttonText: "Apply Directly",
                url: "https://devpost.com/hackathons?open_to[]=public&status[]=upcoming&status[]=open"
            },
            {
                id: "devfolio-fb-1",
                type: "hackathons",
                domain: "frontend",
                isRemote: true,
                ribbonText: "Devfolio",
                ribbonClass: "devfolio",
                company: "DEVFOLIO COMMUNITY",
                title: "ETHIndia Hackathon",
                typeTag: "🏆 Devfolio Hackathon",
                domainTag: "⚙️ Web Development",
                packageTag: "💰 Cash Prizes & Swag",
                extraTag: "🌐 Online Entry",
                location: "📍 Global / Virtual",
                buttonText: "Apply Directly",
                url: "https://ethindia.devfolio.co/"
            },
            {
                id: "hackerearth-fb-1",
                type: "hackathons",
                domain: "cybersecurity",
                isRemote: true,
                ribbonText: "HackerEarth",
                ribbonClass: "hackerearth",
                company: "HACKEREARTH GLOBAL",
                title: "International Cybersecurity & Defense Sprint",
                typeTag: "🏆 HackerEarth Challenge",
                domainTag: "🛡️ Cybersecurity",
                packageTag: "💰 $15,000 Cash Pool",
                extraTag: "🌐 Online Entry",
                location: "📍 Global / Virtual",
                buttonText: "Apply Directly",
                url: "https://www.hackerearth.com/challenges/hackathon/"
            }
        ];

        function detectDomain(text = '') {
            const lower = text.toLowerCase();
            if (lower.includes('front') || lower.includes('react') || lower.includes('css') || lower.includes('web') || lower.includes('ui') || lower.includes('vue')) return 'frontend';
            if (lower.includes('data') || lower.includes('ai') || lower.includes('ml') || lower.includes('python') || lower.includes('learning')) return 'ai';
            if (lower.includes('sec') || lower.includes('cyber') || lower.includes('hack') || lower.includes('audit')) return 'cybersecurity';
            return 'backend';
        }

        function getDirectApplyUrl(source, item) {
            const itemUrl = item.link || item.url || '';
            const slug = item.slug || item.username || '';
            const title = encodeURIComponent(item.title || '');

            if (source === 'devpost') {
                if (itemUrl.includes('devpost.com')) {
                    return itemUrl;
                }
                return `https://devpost.com/hackathons?search=${title}`;
            }

            if (source === 'devfolio') {
                // If direct slug exists, route directly to the specific devfolio event page
                if (slug) {
                    return `https://${slug}.devfolio.co/`;
                }
                if (itemUrl && itemUrl.includes('.devfolio.co')) {
                    return itemUrl;
                }
                return `https://devfolio.co/hackathons?q=${title}`;
            }

            if (source === 'hackerearth') {
                if (itemUrl.includes('/challenges/')) {
                    return itemUrl;
                }
                return `https://www.hackerearth.com/challenges/hackathon/`;
            }

            return itemUrl;
        }

        async function fetchAllSources() {
            container.innerHTML = '<div class="no-results"><h3>Fetching Hackathons & Jobs...</h3></div>';

            try {
                const proxy = "https://api.allorigins.win/raw?url=";

                const [devpostRes, devfolioRes, hackerearthRes, remotiveRes, arbeitnowRes, companiesRes] = await Promise.allSettled([
                    fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fdevpost.com%2Ffeed'),
                    // Fetch direct JSON list from Devfolio to capture exact unique event slugs
                    fetch(`${proxy}${encodeURIComponent('https://devfolio.co/api/hackathons?type=open&limit=15')}`),
                    fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.hackerearth.com%2Fblog%2Fdevelopers%2Cfeed%2F'),
                    fetch(`${proxy}${encodeURIComponent('https://remotive.com/api/remote-jobs?limit=30')}`),
                    fetch('https://www.arbeitnow.com/api/job-board-api'),
                    fetch('http://127.0.0.1:5501/api/jobs?prompt=companies')
                ]);

                let processedData = [];

                // 1. Devpost Hackathons
                if (devpostRes.status === 'fulfilled') {
                    try {
                        const json = await devpostRes.value.json();
                        if (json && json.items && json.items.length > 0) {
                            json.items.forEach((item, idx) => {
                                processedData.push({
                                    id: `devpost-${idx}`,
                                    type: 'hackathons',
                                    domain: detectDomain(item.title + ' ' + (item.description || '')),
                                    isRemote: true,
                                    ribbonText: 'Devpost',
                                    ribbonClass: 'devpost',
                                    company: 'DEVPOST HACKATHON',
                                    title: item.title || 'Devpost Challenge',
                                    typeTag: '🏆 Devpost Hackathon',
                                    domainTag: '🧠 Coding Challenge',
                                    packageTag: '💰 Cash & Prizes',
                                    extraTag: '🌐 Online',
                                    location: '📍 Global / Virtual',
                                    buttonText: 'Apply Directly',
                                    url: getDirectApplyUrl('devpost', item)
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                // 2. Devfolio Hackathons (Direct Target URLs)
                if (devfolioRes.status === 'fulfilled') {
                    try {
                        const json = await devfolioRes.value.json();
                        const items = Array.isArray(json) ? json : (json.result || json.data || []);
                        if (items.length > 0) {
                            items.forEach((item, idx) => {
                                const isIntern = (item.name || '').toLowerCase().includes('intern');
                                processedData.push({
                                    id: `devfolio-${item.id || idx}`,
                                    type: isIntern ? 'internships' : 'hackathons',
                                    domain: detectDomain(item.name || item.title || ''),
                                    isRemote: item.is_online !== false,
                                    ribbonText: 'Devfolio',
                                    ribbonClass: 'devfolio',
                                    company: (item.organisation_name || 'DEVFOLIO').toUpperCase(),
                                    title: item.name || item.title || 'Devfolio Event',
                                    typeTag: isIntern ? '🎓 Devfolio Internship' : '🏆 Devfolio Hackathon',
                                    domainTag: '⚙️ Developer Sprint',
                                    packageTag: item.prizes_total ? `💰 ${item.prizes_total}` : '💰 Cash & Perks',
                                    extraTag: item.is_online ? '🌐 Online' : '🏢 In-Person',
                                    location: item.location || (item.is_online ? '📍 Virtual' : '📍 On-Site'),
                                    buttonText: 'Apply Directly',
                                    url: getDirectApplyUrl('devfolio', item)
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                // 3. HackerEarth Challenges
                if (hackerearthRes.status === 'fulfilled') {
                    try {
                        const json = await hackerearthRes.value.json();
                        if (json && json.items && json.items.length > 0) {
                            json.items.forEach((item, idx) => {
                                processedData.push({
                                    id: `hackerearth-${idx}`,
                                    type: 'hackathons',
                                    domain: detectDomain(item.title || ''),
                                    isRemote: true,
                                    ribbonText: 'HackerEarth',
                                    ribbonClass: 'hackerearth',
                                    company: 'HACKEREARTH',
                                    title: item.title || 'HackerEarth Competition',
                                    typeTag: '🏆 HackerEarth Sprint',
                                    domainTag: '🧠 Competitive Coding',
                                    packageTag: '💰 Cash Prizes',
                                    extraTag: '🌐 Online',
                                    location: '📍 Virtual',
                                    buttonText: 'Apply Directly',
                                    url: getDirectApplyUrl('hackerearth', item)
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                // Fallbacks if list is minimal
                if (processedData.length < 3) {
                    processedData = processedData.concat(fallbackHackathons);
                }

                // 4. Remotive Jobs & Internships
                if (remotiveRes.status === 'fulfilled') {
                    try {
                        const json = await remotiveRes.value.json();
                        if (json && json.jobs) {
                            json.jobs.forEach(job => {
                                const title = job.title || 'Software Developer';
                                const titleLower = title.toLowerCase();
                                const isIntern = titleLower.includes('intern') || titleLower.includes('trainee');

                                processedData.push({
                                    id: `remotive-${job.id}`,
                                    type: isIntern ? 'internships' : 'jobs',
                                    domain: detectDomain(title + ' ' + (job.category || '')),
                                    isRemote: true,
                                    ribbonText: isIntern ? 'Internship' : 'Live Job',
                                    ribbonClass: isIntern ? 'intern' : '',
                                    company: (job.company_name || 'TECH').toUpperCase(),
                                    title: title,
                                    typeTag: isIntern ? '🎓 Internship' : '💼 Full-Time Job',
                                    domainTag: `⚙️ ${job.category || 'Tech'}`,
                                    packageTag: (job.salary && job.salary.trim()) ? `💰 ${job.salary}` : '💰 Competitive Pay',
                                    extraTag: '🌐 Remote',
                                    location: `📍 ${job.candidate_required_location || 'Remote'}`,
                                    buttonText: 'Apply Directly',
                                    url: job.url
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                // 5. Arbeitnow Jobs & Internships
                if (arbeitnowRes.status === 'fulfilled') {
                    try {
                        const json = await arbeitnowRes.value.json();
                        if (json && json.data) {
                            json.data.forEach((job, idx) => {
                                const title = job.title || 'Developer';
                                const titleLower = title.toLowerCase();
                                const isIntern = titleLower.includes('intern') || titleLower.includes('trainee');

                                processedData.push({
                                    id: `arbeitnow-${idx}`,
                                    type: isIntern ? 'internships' : 'jobs',
                                    domain: detectDomain(title),
                                    isRemote: job.remote === true,
                                    ribbonText: isIntern ? 'Internship' : 'Global Job',
                                    ribbonClass: isIntern ? 'intern' : '',
                                    company: (job.company_name || 'GLOBAL TECH').toUpperCase(),
                                    title: title,
                                    typeTag: isIntern ? '🎓 Internship' : '💼 Full-Time Job',
                                    domainTag: '⚙️ Software',
                                    packageTag: '💰 Market Rate',
                                    extraTag: job.remote ? '🌐 Remote' : '🏢 On-Site',
                                    location: `📍 ${job.location || 'Remote'}`,
                                    buttonText: 'Apply Directly',
                                    url: job.url
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                // 6. Official company career pages from the FastAPI backend
                if (companiesRes.status === 'fulfilled') {
                    try {
                        const companies = await companiesRes.value.json();
                        if (Array.isArray(companies)) {
                            companies.forEach(company => {
                                processedData.push({
                                    ...company,
                                    url: company.apply_link,
                                    buttonText: company.buttonText || 'View Careers'
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                }

                allData = processedData;
                renderCards();

            } catch (error) {
                console.error("Fetch error:", error);
                allData = fallbackHackathons;
                renderCards();
            }
        }

        function toggleBookmark(id) {
            if (savedIds.includes(id)) {
                savedIds = savedIds.filter(item => item !== id);
            } else {
                savedIds.push(id);
            }
            localStorage.setItem('saved_multi_opps', JSON.stringify(savedIds));
            renderCards();
        }

        function renderCards() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedType = typeFilter ? typeFilter.value : 'all';
            const selectedDomain = domainFilter ? domainFilter.value : 'all';
            const selectedLocation = locationFilter ? locationFilter.value : 'all';

            const filtered = allData.filter(item => {
                const matchesQuery = query === '' ||
                    item.title.toLowerCase().includes(query) ||
                    item.company.toLowerCase().includes(query) ||
                    item.domainTag.toLowerCase().includes(query);

                let matchesType = (selectedType === 'all' || item.type === selectedType);
                if (selectedType === 'saved') {
                    matchesType = savedIds.includes(item.id);
                }

                const matchesDomain = (selectedDomain === 'all' || item.domain === selectedDomain);

                let matchesLocation = true;
                if (selectedLocation === 'remote') matchesLocation = item.isRemote === true;
                if (selectedLocation === 'onsite') matchesLocation = item.isRemote === false;

                return matchesQuery && matchesType && matchesDomain && matchesLocation;
            });

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>No opportunities match your current filters. Try setting Domain or Work Mode to "All".</h3></div>';
                return;
            }

            filtered.forEach(item => {
                const isSaved = savedIds.includes(item.id);
                const html = `
                    <div class="job-card" data-type="${item.type}" data-domain="${item.domain}">
                        <div class="ribbon ${item.ribbonClass}">${item.ribbonText}</div>
                        <div class="company-name">${item.company}</div>
                        <h2 class="job-title">${item.title}</h2>
                        
                        <div class="tags-container">
                            <span class="tag domain">${item.typeTag}</span>
                            <span class="tag">${item.domainTag}</span>
                            <span class="tag package">${item.packageTag}</span>
                            ${item.extraTag ? `<span class="tag">${item.extraTag}</span>` : ''}
                        </div>

                        <div class="card-footer">
                            <div class="location">${item.location}</div>
                            <div class="action-btns">
                                <button class="bookmark-btn ${isSaved ? 'saved' : ''}" onclick="toggleBookmark('${item.id}')">
                                    ${isSaved ? '★ Saved' : '☆ Save'}
                                </button>
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="apply-btn">${item.buttonText}</a>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        searchInput.addEventListener('input', renderCards);
        if (typeFilter) typeFilter.addEventListener('change', renderCards);
        if (domainFilter) domainFilter.addEventListener('change', renderCards);
        if (locationFilter) locationFilter.addEventListener('change', renderCards);

        document.addEventListener('DOMContentLoaded', fetchAllSources);
    </script>
</body>

</html>
