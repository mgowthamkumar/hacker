<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AutoHire career workspace.">
    <meta name="theme-color" content="#070b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <title>Sign in | AutoHire AI</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="api-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(56, 189, 248, 0.15);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans", sans-serif; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Mesh Background */
        #bg3dCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -150px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(40px, -30px); }
        }

        /* AUTH SHELL CARD */
        .shell {
            width: min(440px, 100%);
            padding: 40px;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-3d);
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s var(--ease-out), box-shadow 0.4s;
        }

        .shell:hover {
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(56, 189, 248, 0.25);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font: 800 1.5rem "Space Grotesk", sans-serif;
            text-decoration: none;
        }
        .brand span {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 24px 0 6px;
            font: 800 2.2rem "Space Grotesk", sans-serif;
            letter-spacing: -0.04em;
            color: var(--text-main);
        }

        .intro {
            margin-bottom: 28px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 24px;
            padding: 15px 20px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #0284c7 0%, #a855f7 100%);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--card-border);
        }

        .google-button {
            min-height: 44px;
            display: flex;
            justify-content: center;
        }

        .message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .footer {
            margin-top: 26px;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.88rem;
        }

        .footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .shell { padding: 28px 20px; }
        }

        /* OTP 6-Digit Modal Styles */
        .otp-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(7, 11, 20, 0.88);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s var(--ease-out);
        }

        .otp-modal-card {
            width: min(460px, 100%);
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: var(--shadow-3d);
            backdrop-filter: blur(24px);
            color: var(--text-main);
            text-align: center;
            position: relative;
        }

        .otp-icon-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .otp-boxes-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 28px 0 20px;
        }

        .otp-box {
            width: 48px;
            height: 58px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.85);
            color: var(--primary);
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            transition: all 0.2s var(--ease-out);
            caret-color: var(--primary);
        }

        .otp-box:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .otp-timer {
            font-size: 0.88rem;
            font-weight: 600;
            color: #eab308;
            margin-bottom: 20px;
        }

        .otp-resend-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        .otp-resend-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            text-decoration: none;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>
    <!-- 3D Canvas Mesh Background -->
    <canvas id="bg3dCanvas"></canvas>

    <!-- Ambient Glow Effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="shell 3d-card">
        <a class="brand" href="index.html">🤖 Auto<span>Hire AI</span></a>
        <h1>Sign in</h1>
        <p class="intro">Continue to your career workspace.</p>

        <form id="loginForm">
            <label for="emailInput">Email address</label>
            <input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com">
            <label for="passInput">Password</label>
            <input id="passInput" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button id="loginButton" type="submit">Sign In</button>
            <div class="message" id="loginMessage" role="status"></div>
        </form>

        <div class="divider">──────── OR ────────</div>

        <div id="g_id_onload"
            data-client_id="869568422226-14fcbs1j1esdl1f0phijfhoude5il7qk.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"
            data-auto_select="false"></div>
        <div class="google-button">
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                data-text="continue_with"></div>
        </div>

        <p class="footer">New to AutoHire? <a href="register.html">Create an account</a></p>
    </main>

    <script>
        // 1. Canvas 3D Particle Mesh
        (function init3DCanvas() {
            const canvas = document.getElementById("bg3dCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            const particles = [];
            const particleCount = Math.min(Math.floor(width / 24), 50);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? "rgba(56, 189, 248, 0.35)" : "rgba(168, 85, 247, 0.25)"
                });
            }

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // 2. 3D Card Perspective Tilt
        const card = document.querySelector(".shell");
        if (card) {
            card.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            });

            card.addEventListener("mouseleave", () => {
                card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
            });
        }

        // 3. Auth Handlers Logic
        const apiOrigin = window.AUTOHIRE_API_ORIGIN;
        const apiUrl = window.AUTOHIRE_API_URL;
        const loginMessage = document.getElementById("loginMessage");

        function processUserLogin(userObj, redirectUrl = "dashboard.html") {
            if (!userObj) return;
            if (window.AutoHireAuth) window.AutoHireAuth.saveUser(userObj);
            window.location.href = redirectUrl;
        }

        function getOrCreateDeviceId() {
            let deviceId = "";
            try {
                deviceId = localStorage.getItem("autohire_device_id") || "";
                if (!deviceId) {
                    const match = document.cookie.match(/(?:^|; )autohire_device_id=([^;]*)/);
                    if (match) deviceId = decodeURIComponent(match[1]);
                }
                if (!deviceId) {
                    deviceId = "dev_" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "_" + Math.random().toString(36).substring(2)));
                    localStorage.setItem("autohire_device_id", deviceId);
                    document.cookie = `autohire_device_id=${encodeURIComponent(deviceId)}; Path=/; Max-Age=31536000; SameSite=Lax`;
                }
            } catch (e) {
                deviceId = "dev_default";
            }
            return deviceId;
        }

        function getAuthCandidateUrls() {
            const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:";
            const active = window.ACTIVE_AUTH_API_URL;
            return [
                active,
                isLocal ? "http://127.0.0.1:8800/api/auth" : null,
                isLocal ? "http://localhost:8800/api/auth" : null,
                apiUrl,
                window.location.origin ? `${window.location.origin}/api/auth` : null,
                "http://127.0.0.1:8800/api/auth",
                "http://localhost:8800/api/auth",
                "https://hacker-drab-mu.vercel.app/api/auth"
            ].filter((val, idx, arr) => val && arr.indexOf(val) === idx);
        }

        function renderOtpModal(tempToken, maskedEmail, rawEmail = "") {
            let currentTempToken = tempToken;
            let userEmail = (rawEmail || "").trim().toLowerCase();
            if (!userEmail) {
                const emailInp = document.getElementById("emailInput");
                if (emailInp && emailInp.value) {
                    userEmail = emailInp.value.trim().toLowerCase();
                }
            }
            if (userEmail) {
                try { sessionStorage.setItem("autohire_otp_email", userEmail); } catch(e) {}
            } else {
                try { userEmail = sessionStorage.getItem("autohire_otp_email") || ""; } catch(e) {}
            }
            const existing = document.getElementById("autohire-otp-modal");
            if (existing) existing.remove();

            const modalOverlay = document.createElement("div");
            modalOverlay.id = "autohire-otp-modal";
            modalOverlay.className = "otp-modal-overlay";

            modalOverlay.innerHTML = `
                <div class="otp-modal-card">
                    <div class="otp-icon-badge">📧</div>
                    <h2 style="font-family:'Space Grotesk',sans-serif; font-size:1.7rem; margin-bottom:8px; color:#fff;">Verify your email</h2>
                    <p style="color:var(--text-muted); font-size:0.92rem; line-height:1.5; margin-bottom:12px;">
                        We've sent a 6-digit verification code to<br>
                        <strong style="color:var(--primary); font-size:0.98rem; letter-spacing:0.02em;">${maskedEmail}</strong>
                    </p>

                    <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin:0 auto 22px; color:#94a3b8; font-size:0.85rem;">
                        <span>🔒</span>
                        <span>Enter the 6-digit security code to complete sign-in</span>
                    </div>

                    <div class="otp-boxes-wrapper" id="otpBoxesContainer">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="0" autocomplete="one-time-code" autofocus>
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="1" autocomplete="off">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="2" autocomplete="off">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="3" autocomplete="off">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="4" autocomplete="off">
                        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box" data-index="5" autocomplete="off">
                    </div>

                    <div style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px 14px; margin-bottom:14px; text-align:center;">
                        <div style="font-size:0.82rem; color:#94a3b8; margin-bottom:4px;">Didn't receive the code?</div>
                        <div style="font-size:0.78rem; color:#64748b;">Check your <strong>Inbox</strong>, <strong>Spam/Junk</strong>, and <strong>Promotions</strong> folders.</div>
                    </div>

                    <div class="otp-timer" id="otpTimerText" style="margin-bottom:12px;">⏱️ Resend code in 45 seconds</div>
                    <div class="message" id="otpModalError" style="margin-bottom:16px;"></div>

                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <button type="button" id="btnVerifyOtpSubmit" style="width:100%; padding:15px; border:none; border-radius:var(--radius-md); background:linear-gradient(135deg, #0284c7 0%, #a855f7 100%); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:0 4px 20px rgba(168,85,247,0.35); transition:all 0.3s var(--ease-out);">Verify & Complete Login</button>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                            <button type="button" id="btnCancelOtpModal" style="background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">Cancel</button>
                            <button type="button" id="btnResendOtpSubmit" class="otp-resend-btn" disabled>Resend OTP</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(modalOverlay);

            const boxesContainer = document.getElementById("otpBoxesContainer");
            const inputs = Array.from(boxesContainer.querySelectorAll(".otp-box"));
            const btnVerify = document.getElementById("btnVerifyOtpSubmit");
            const btnResend = document.getElementById("btnResendOtpSubmit");
            const btnCancel = document.getElementById("btnCancelOtpModal");
            const timerText = document.getElementById("otpTimerText");
            const errorDisplay = document.getElementById("otpModalError");

            inputs[0].focus();

            // Auto-focus movement and keyboard navigation
            inputs.forEach((input, index) => {
                input.addEventListener("input", (e) => {
                    const val = e.target.value.replace(/\D/g, "");
                    e.target.value = val;
                    if (val && index < 5) {
                        inputs[index + 1].focus();
                    }
                    if (inputs.every(inp => inp.value.length === 1)) {
                        errorDisplay.textContent = "";
                    }
                });

                input.addEventListener("keydown", (e) => {
                    if (e.key === "Backspace") {
                        if (!input.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = "";
                        }
                    } else if (e.key === "ArrowLeft" && index > 0) {
                        inputs[index - 1].focus();
                    } else if (e.key === "ArrowRight" && index < 5) {
                        inputs[index + 1].focus();
                    }
                });
            });

            // Paste Handler for 6-digit OTP
            boxesContainer.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData("text");
                const digits = pasteData.replace(/\D/g, "").slice(0, 6);
                if (digits) {
                    digits.split("").forEach((digit, idx) => {
                        if (inputs[idx]) inputs[idx].value = digit;
                    });
                    const lastIndex = Math.min(digits.length, 5);
                    inputs[lastIndex].focus();
                }
            });

            // Resend Countdown Timer with customizable duration
            let countdown = 45;
            let timerInterval = null;

            function startResendTimer(seconds = 45) {
                countdown = seconds;
                btnResend.disabled = true;
                btnResend.textContent = "Resend OTP";
                timerText.style.color = "#eab308";
                timerText.textContent = `⏱️ Resend code in ${countdown} seconds`;

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    countdown--;
                    if (countdown <= 0) {
                        clearInterval(timerInterval);
                        timerText.style.color = "#4ade80";
                        timerText.textContent = "⏱️ You can now request a new code.";
                        btnResend.disabled = false;
                        btnResend.textContent = "Resend OTP";
                    } else {
                        timerText.textContent = `⏱️ Resend code in ${countdown} seconds`;
                    }
                }, 1000);
            }

            startResendTimer(45);

            btnCancel.addEventListener("click", () => {
                if (timerInterval) clearInterval(timerInterval);
                modalOverlay.remove();
            });

            // Resend OTP Action
            btnResend.addEventListener("click", async () => {
                if (btnResend.disabled) return;
                btnResend.disabled = true;
                btnResend.textContent = "Sending...";
                errorDisplay.style.color = "#38bdf8";
                errorDisplay.textContent = "Sending new verification code...";

                const devId = getOrCreateDeviceId();
                const candidates = getAuthCandidateUrls();
                let sendSuccess = false;
                let lastError = "";

                for (const base of candidates) {
                    try {
                        const isCrossOrigin = window.location.protocol === "file:" || !base.startsWith(window.location.origin);
                        const res = await fetch(`${base}/resend-otp`, {
                            method: "POST",
                            headers: { 
                                "Content-Type": "application/json",
                                "X-Device-Id": devId
                            },
                            credentials: isCrossOrigin ? "omit" : "include",
                            body: JSON.stringify({ 
                                tempToken: currentTempToken,
                                email: userEmail,
                                deviceId: devId 
                            })
                        });

                        const data = await res.json();

                        if (res.status === 429) {
                            sendSuccess = true;
                            const waitSec = data.secondsRemaining || 45;
                            errorDisplay.style.color = "#eab308";
                            errorDisplay.textContent = data.message || `Please wait ${waitSec} seconds before resending.`;
                            startResendTimer(waitSec);
                            return;
                        }

                        if (!res.ok) {
                            lastError = data.message || "Unable to send verification code. Please try again.";
                            continue;
                        }

                        sendSuccess = true;
                        window.ACTIVE_AUTH_API_URL = base;
                        if (data.tempToken) {
                            currentTempToken = data.tempToken;
                        }

                        errorDisplay.style.color = "#4ade80";
                        errorDisplay.textContent = data.message || "A new 6-digit code has been dispatched to your email.";

                        inputs.forEach(inp => inp.value = "");
                        inputs[0].focus();
                        startResendTimer(45);
                        break;
                    } catch (err) {
                        console.warn(`Resend connection attempt to ${base} notice:`, err.message);
                    }
                }

                if (!sendSuccess) {
                    errorDisplay.style.color = "#f87171";
                    if (lastError && lastError.toLowerCase().includes("expired")) {
                        errorDisplay.innerHTML = `${lastError} <a href="sign-in.html" style="color:#38bdf8; text-decoration:underline; font-weight:600; margin-left:4px;">Sign in again</a>`;
                    } else {
                        errorDisplay.textContent = lastError || "Unable to send verification code. Please try again.";
                    }
                    btnResend.disabled = false;
                    btnResend.textContent = "Resend OTP";
                }
            });

            // Verify OTP Submit Action
            btnVerify.addEventListener("click", async () => {
                const otp = inputs.map(inp => inp.value).join("");
                if (otp.length < 6) {
                    errorDisplay.style.color = "#f87171";
                    errorDisplay.textContent = "Please enter the complete 6-digit verification code.";
                    return;
                }

                btnVerify.disabled = true;
                btnVerify.textContent = "Verifying...";
                errorDisplay.textContent = "";

                const devId = getOrCreateDeviceId();
                const candidates = getAuthCandidateUrls();
                let verifySuccess = false;
                let lastError = "";

                for (const base of candidates) {
                    try {
                        const isCrossOrigin = window.location.protocol === "file:" || !base.startsWith(window.location.origin);
                        const response = await fetch(`${base}/verify-otp`, {
                            method: "POST",
                            headers: { 
                                "Content-Type": "application/json",
                                "X-Device-Id": devId
                            },
                            credentials: isCrossOrigin ? "omit" : "include",
                            body: JSON.stringify({ 
                                tempToken: currentTempToken, 
                                otp, 
                                email: userEmail,
                                deviceId: devId 
                            })
                        });
                        const data = await response.json();
                        if (!response.ok) {
                            lastError = data.message || "Invalid verification code. Please try again.";
                            if (response.status === 400 || response.status === 429) {
                                break;
                            }
                            continue;
                        }

                        verifySuccess = true;
                        window.ACTIVE_AUTH_API_URL = base;
                        errorDisplay.style.color = "#4ade80";
                        errorDisplay.textContent = "✅ Email verified! Redirecting to workspace...";
                        if (timerInterval) clearInterval(timerInterval);

                        setTimeout(() => {
                            processUserLogin(data.user, data.redirect || "dashboard.html");
                        }, 600);
                        return;
                    } catch (error) {
                        console.warn(`Verify connection attempt to ${base} notice:`, error.message);
                    }
                }

                errorDisplay.style.color = "#f87171";
                errorDisplay.textContent = lastError || "Connection error while verifying OTP.";
                btnVerify.disabled = false;
                btnVerify.textContent = "Verify & Complete Login";
            });
        }

        async function handleCredentialResponse(response) {
            loginMessage.style.color = "#38bdf8";
            loginMessage.textContent = "Verifying Google account...";

            // Candidate URLs to support local server, live preview, and hosted domains
            const candidateUrls = getAuthCandidateUrls();

            let serverSuccess = false;
            let lastErrorMsg = "";

            const devId = getOrCreateDeviceId();
            for (const base of candidateUrls) {
                try {
                    const isCrossOrigin = window.location.protocol === "file:" || !base.startsWith(window.location.origin);
                    const loginResponse = await fetch(`${base}/google`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "X-Device-Id": devId
                        },
                        credentials: isCrossOrigin ? "omit" : "include",
                        body: JSON.stringify({ 
                            credential: response.credential,
                            deviceId: devId
                        })
                    });
                    
                    const data = await loginResponse.json();

                    if (!loginResponse.ok) {
                        lastErrorMsg = data.detail || data.message || "Unable to send verification code. Please try again.";
                        loginMessage.style.color = "#f87171";
                        loginMessage.textContent = lastErrorMsg;
                        continue;
                    }

                    serverSuccess = true;
                    window.ACTIVE_AUTH_API_URL = base;

                    // Google login requires OTP verification before session creation
                    if (data.pendingOtp && data.tempToken) {
                        loginMessage.textContent = "";
                        let googleEmail = data.targetEmail || "";
                        if (!googleEmail && response.credential) {
                            try {
                                const payload = JSON.parse(decodeURIComponent(escape(atob(response.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
                                googleEmail = (payload.email || "").toLowerCase();
                            } catch (e) {}
                        }
                        renderOtpModal(data.tempToken, data.email, googleEmail);
                    } else if (data.user) {
                        loginMessage.style.color = "#4ade80";
                        loginMessage.textContent = "Welcome back! Connecting...";
                        processUserLogin(data.user, data.redirect || "dashboard.html");
                    }
                    return;
                } catch (err) {
                    console.warn(`Connection attempt to ${base} notice:`, err.message);
                }
            }

            if (!serverSuccess) {
                loginMessage.style.color = "#f87171";
                loginMessage.textContent = lastErrorMsg || "Unable to send verification code. Please try again.";
            }
        }

        // METHOD 1: Email Address + Password Auth Form Handler
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const loginButton = document.getElementById("loginButton");
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            loginMessage.textContent = "";

            const email = document.getElementById("emailInput").value.trim().toLowerCase();
            const password = document.getElementById("passInput").value;

            // 1. Client-side email format validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                loginMessage.style.color = "#f87171";
                loginMessage.textContent = "Please enter a valid email address.";
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
                return;
            }

            // Candidate URLs to support local server and network environments
            const candidateUrls = getAuthCandidateUrls();

            let serverSuccess = false;
            let lastErrorMsg = "";

            const devId = getOrCreateDeviceId();
            for (const base of candidateUrls) {
                try {
                    const isCrossOrigin = window.location.protocol === "file:" || !base.startsWith(window.location.origin);
                    const response = await fetch(`${base}/login`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "X-Device-Id": devId
                        },
                        credentials: isCrossOrigin ? "omit" : "include",
                        body: JSON.stringify({ email, password, deviceId: devId })
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        lastErrorMsg = data.message || "Invalid email or password.";
                        loginMessage.style.color = "#f87171";
                        loginMessage.textContent = lastErrorMsg;
                        serverSuccess = true;
                        break;
                    }

                    serverSuccess = true;
                    window.ACTIVE_AUTH_API_URL = base;

                    // Mandates Security OTP Verification before dashboard access
                    if (data.pendingOtp && data.tempToken) {
                        loginMessage.textContent = "";
                        renderOtpModal(data.tempToken, data.email, email);
                    } else if (data.user) {
                        processUserLogin(data.user, data.redirect || "dashboard.html");
                    }
                    break;
                } catch (err) {
                    console.warn(`Login connection attempt to ${base} notice:`, err.message);
                }
            }

            if (!serverSuccess) {
                loginMessage.style.color = "#f87171";
                loginMessage.textContent = lastErrorMsg || "Unable to connect to authentication service. Please try again.";
            }

            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        });

        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("switch") === "true") {
                loginMessage.style.color = "#38bdf8";
                loginMessage.textContent = "🔄 Account reset. Select or sign in with another account below:";
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    window.google.accounts.id.disableAutoSelect();
                }
            } else {
                const currentUser = window.AutoHireAuth ? window.AutoHireAuth.getUser() : null;
                if (currentUser) {
                    fetch(`${apiUrl}/me`, { credentials: "include" }).then(async (response) => {
                        if (response.ok) window.location.href = "dashboard.html";
                    }).catch(() => { });
                }
            }
        });
    </script>
