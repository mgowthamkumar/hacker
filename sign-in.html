<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AutoHire career workspace.">
    <title>Sign in | AutoHire AI</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="api-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(56, 189, 248, 0.15);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans", sans-serif; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Mesh Background */
        #bg3dCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -150px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(40px, -30px); }
        }

        /* AUTH SHELL CARD */
        .shell {
            width: min(440px, 100%);
            padding: 40px;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-3d);
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s var(--ease-out), box-shadow 0.4s;
        }

        .shell:hover {
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(56, 189, 248, 0.25);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font: 800 1.5rem "Space Grotesk", sans-serif;
            text-decoration: none;
        }
        .brand span {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 24px 0 6px;
            font: 800 2.2rem "Space Grotesk", sans-serif;
            letter-spacing: -0.04em;
            color: var(--text-main);
        }

        .intro {
            margin-bottom: 28px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 24px;
            padding: 15px 20px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #0284c7 0%, #a855f7 100%);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--card-border);
        }

        .google-button {
            min-height: 44px;
            display: flex;
            justify-content: center;
        }

        .github-button {
            width: 100%;
            margin-top: 14px;
            padding: 14px 18px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.25s var(--ease-out);
        }

        .github-button:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .github-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .footer {
            margin-top: 26px;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.88rem;
        }

        .footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .shell { padding: 28px 20px; }
        }
    </style>
</head>

<body>
    <!-- 3D Canvas Mesh Background -->
    <canvas id="bg3dCanvas"></canvas>

    <!-- Ambient Glow Effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="shell 3d-card">
        <a class="brand" href="index.html">🤖 Auto<span>Hire AI</span></a>
        <h1>Sign in</h1>
        <p class="intro">Continue to your career workspace.</p>

        <form id="loginForm">
            <label for="emailInput">Email address</label>
            <input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com">
            <label for="passInput">Password</label>
            <input id="passInput" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button id="loginButton" type="submit">Sign in to Workspace</button>
            <div class="message" id="loginMessage" role="status"></div>
        </form>

        <div class="divider">or continue with</div>

        <div id="g_id_onload" data-client_id="869568422226-14fcbs1j1esdl1f0phijfhoude5il7qk.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"></div>
        <div class="google-button">
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                data-text="continue_with"></div>
        </div>

        <a href="https://github.com/login/oauth/authorize" class="github-button" id="githubSignInBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            Continue with GitHub
        </a>

        <p class="footer">New to AutoHire? <a href="register.html">Create an account</a></p>
    </main>

    <script>
        // 1. Canvas 3D Particle Mesh
        (function init3DCanvas() {
            const canvas = document.getElementById("bg3dCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            const particles = [];
            const particleCount = Math.min(Math.floor(width / 24), 50);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? "rgba(56, 189, 248, 0.35)" : "rgba(168, 85, 247, 0.25)"
                });
            }

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // 2. 3D Card Perspective Tilt
        const card = document.querySelector(".shell");
        if (card) {
            card.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            });

            card.addEventListener("mouseleave", () => {
                card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
            });
        }

        // 3. Auth Handlers Logic
        const apiOrigin = window.AUTOHIRE_API_ORIGIN;
        const apiUrl = window.AUTOHIRE_API_URL;
        const loginMessage = document.getElementById("loginMessage");

        async function handleCredentialResponse(response) {
            let googleUser = null;
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                const payload = JSON.parse(jsonPayload);

                googleUser = {
                    id: payload.sub || Date.now().toString(),
                    name: payload.name || payload.email.split('@')[0],
                    email: (payload.email || "").toLowerCase(),
                    picture: payload.picture || ""
                };
            } catch (e) {
                console.error("JWT token decode error:", e);
            }

            try {
                const loginResponse = await fetch(`${apiUrl}/google`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ credential: response.credential })
                });
                if (loginResponse.ok) {
                    const data = await loginResponse.json();
                    if (data.user) {
                        googleUser = data.user;
                    }
                }
            } catch (error) {
                console.warn("Backend server connection notice: using client session.");
            }

            if (googleUser && googleUser.email) {
                if (window.AutoHireAuth) {
                    window.AutoHireAuth.saveUser(googleUser);
                } else {
                    const profileObj = {
                        fullName: googleUser.name,
                        emailAddress: googleUser.email,
                        picture: googleUser.picture || ""
                    };
                    localStorage.setItem("autoHireProfile", JSON.stringify(profileObj));
                    localStorage.setItem("loggedInUser", JSON.stringify(googleUser));
                }
                window.location.href = "index.html";
            } else {
                loginMessage.textContent = "Google sign-in could not be completed.";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const loginButton = document.getElementById("loginButton");
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            loginMessage.textContent = "";

            try {
                const response = await fetch(`${apiUrl}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        email: document.getElementById("emailInput").value.trim(),
                        password: document.getElementById("passInput").value
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    loginMessage.textContent = data.message || "Invalid email or password.";
                    return;
                }
                if (data.user && window.AutoHireAuth) {
                    window.AutoHireAuth.saveUser(data.user);
                }
                window.location.href = "index.html";
            } catch (error) {
                const email = document.getElementById("emailInput").value.trim().toLowerCase();
                const password = document.getElementById("passInput").value;
                const users = JSON.parse(localStorage.getItem("autoHireUsers") || "[]");
                const user = users.find(candidate => candidate.email === email && candidate.password === password);
                if (!user) {
                    loginMessage.textContent = "Invalid email or password.";
                    return;
                }
                if (window.AutoHireAuth) {
                    window.AutoHireAuth.saveUser(user);
                } else {
                    localStorage.setItem("autoHireProfile", JSON.stringify(user));
                    localStorage.setItem("loggedInUser", JSON.stringify(user));
                }
                window.location.href = "index.html";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign in to Workspace";
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("switch") === "true") {
                loginMessage.style.color = "#38bdf8";
                loginMessage.textContent = "🔄 Account reset. Select or sign in with another account below:";
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    window.google.accounts.id.disableAutoSelect();
                }
            } else {
                const currentUser = window.AutoHireAuth ? window.AutoHireAuth.getUser() : null;
                if (currentUser) {
                    fetch(`${apiUrl}/me`, { credentials: "include" }).then(async (response) => {
                        if (response.ok) window.location.href = "index.html";
                    }).catch(() => { });
                }
            }
        });
    </script>
</body>

</html>
