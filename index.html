<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAG System</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .container {
            width: 360px;
            background: #1F2937;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #FACC15;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #374151;
            background: #374151;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #FACC15;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #eab308;
        }

        .or {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #9CA3AF;
        }

        .g_id_signin {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="emailInput" placeholder="Enter Email" required>
            <input type="password" id="passInput" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="or">------------- OR -------------</div>

        <div id="g_id_onload" data-client_id="985018230796-l4mivu7or4h81n86na3rpgu0c8ru53ot.apps.googleusercontent.com"
            data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large"></div>
    </div>

    <script>
        const apiUrl = `${window.location.protocol === "file:" ? "http://localhost:5500" : window.location.origin}/api/auth`;
        const landingPage = "profile.html";

        async function handleCredentialResponse(response) {
            try {
                const loginResponse = await fetch(`${apiUrl}/google`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await loginResponse.json();
                if (!loginResponse.ok) return alert(data.message || "Google sign-in failed.");
                window.location.href = landingPage;
            } catch (error) {
                alert("Cannot connect to the authentication server. Start server.js first.");
            }
        }

        fetch(`${apiUrl}/me`, { credentials: "include" }).then(response => {
            if (response.ok) window.location.href = landingPage;
        });

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            try {
                const response = await fetch(`${apiUrl}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        email: document.getElementById("emailInput").value.trim(),
                        password: document.getElementById("passInput").value
                    })
                });
                const data = await response.json();
                if (!response.ok) return alert(data.message);
                window.location.href = landingPage;
            } catch (error) {
                alert("Cannot connect to the backend. Start server.js first.");
            }
        });
    </script>
</body>

</html>
