<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAG System</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #111827; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .container { width: 360px; background: #1F2937; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 25px; color: #FACC15; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #374151; background: #374151; color: white; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; background: #FACC15; color: #111827; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #eab308; }
        .or { text-align: center; margin: 20px 0; font-weight: bold; color: #9CA3AF; }
        .g_id_signin { display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="emailInput" placeholder="Enter Email" required>
            <input type="password" id="passInput" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="or">------------- OR -------------</div>

        <div id="g_id_onload" 
             data-client_id="985018230796-l4mivu7or4h81n86na3rpgu0c8ru53ot.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large"></div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            let user = { name: data.name, email: data.email, picture: data.picture };
            localStorage.setItem("loggedInUser", JSON.stringify(user));
            window.location.href = "dashboard.html";
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            let email = document.getElementById("emailInput").value.trim();
            
            // Bypassing hardcoded password validation for demonstration
            let user = { name: email.split('@')[0], email: email };
            localStorage.setItem("loggedInUser", JSON.stringify(user));
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
