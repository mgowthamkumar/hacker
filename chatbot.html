<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Career Agent — Find Jobs, Internships and Hackathons with AI-powered search.">
  <title>AI Career Agent | AutoHire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --surface: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --green: #00ff41;
      --green-glow: rgba(0, 255, 65, 0.25);
      --cyan: #38bdf8;
      --cyan-dim: rgba(56, 189, 248, 0.15);
      --purple: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 0% 0%, rgba(0, 255, 65, 0.1) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 100% 100%, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      background-attachment: fixed;
      color: var(--text);
      padding: 24px;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Scanline texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      padding: 20px 0 36px;
      animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    .header h1 {
      font: 800 clamp(1.8rem, 4vw, 2.8rem) "Space Grotesk", sans-serif;
      color: #fff;
      letter-spacing: -.04em;
      margin-bottom: 8px;
    }
    .header span { color: var(--green); text-shadow: 0 0 12px var(--green-glow); }
    .header p {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 8px;
    }

    /* ── LAYOUT ── */
    .layout-container {
      display: flex;
      max-width: 1240px;
      margin: 0 auto;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 25%;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 26px;
      border-radius: 20px;
      height: fit-content;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      position: sticky;
      top: 20px;
      animation: fadeUp 0.7s var(--ease-out) 0.1s both;
    }

    .sidebar h3 {
      margin-bottom: 16px;
      color: #fff;
      font: 700 1rem "Space Grotesk", sans-serif;
      letter-spacing: -.02em;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .filter-group { margin-bottom: 16px; }

    .filter-group label {
      display: block;
      margin-bottom: 6px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .filter-group textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font: 500 .9rem "Inter", sans-serif;
      outline: none;
      resize: vertical;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .filter-group textarea::placeholder { color: rgba(255,255,255,0.25); }
    .filter-group textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
    }

    /* ── AI Ask button ── */
    .apply-btn {
      background: rgba(56,189,248,0.12);
      color: var(--cyan);
      border: 1px solid rgba(56,189,248,0.35);
      padding: 10px 22px;
      border-radius: 10px;
      font: 600 .9rem "Inter", sans-serif;
      cursor: pointer;
      transition: background 0.25s, transform 0.25s var(--ease-spring), box-shadow 0.25s, color 0.25s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      width: fit-content;
    }
    .apply-btn:hover {
      background: var(--cyan);
      color: #0d1117;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56,189,248,0.35);
    }

    /* ── JOBS LIST ── */
    .jobs-list {
      width: 75%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── JOB CARD ── */
    .job-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 26px;
      border-radius: 16px;
      border: 1px solid var(--border);
      transition: transform 0.35s var(--ease-spring),
                  box-shadow 0.35s var(--ease-out),
                  border-color 0.3s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeUp 0.5s var(--ease-out) both;
    }

    /* Top cyan accent on hover */
    .job-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), #6366f1);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s var(--ease-out);
    }
    .job-card:hover::before { transform: scaleX(1); }

    .job-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(56,189,248,0.2);
      border-color: rgba(56,189,248,0.3);
    }

    /* Ribbon badge */
    .ribbon {
      position: absolute;
      top: 15px;
      right: -35px;
      background: var(--yellow);
      color: #000;
      padding: 5px 40px;
      font: 700 .75rem "Inter", sans-serif;
      transform: rotate(45deg);
    }
    .ribbon.hackathon { background: #a855f7; color: #fff; }
    .ribbon.intern    { background: #3b82f6; color: #fff; }

    .company-name {
      color: var(--yellow);
      font: 700 .8rem "Inter", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .job-title {
      font: 700 1.35rem "Space Grotesk", sans-serif;
      color: #fff;
      margin-bottom: 22px;
      letter-spacing: -.02em;
    }

    /* Status message */
    .status-message {
      text-align: center;
      padding: 50px 40px;
      color: var(--muted);
      font-size: 1rem;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.1);
      animation: fadeUp 0.5s var(--ease-out) both;
    }

    @media (max-width: 768px) {
      .layout-container { flex-direction: column; }
      .sidebar { width: 100%; position: static; }
      .jobs-list { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Explore <span>Opportunities</span></h1>
    <p>Find real Jobs, Internships, and Hackathons powered by AI</p>
  </div>

  <div class="layout-container">
    <div class="sidebar">
      <h3>🤖 AI Career Agent</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px">
        Type what you're looking for, and let the AI find it for you!
      </p>

      <div class="filter-group">
        <label>Ask the Agent</label>
        <textarea id="aiPromptInput" rows="4" placeholder="e.g., I need a python internship..."></textarea>
      </div>

      <button id="askAgentBtn" class="apply-btn" style="width: 100%; text-align: center; margin-top: 5px">
        Ask AI Agent
      </button>
    </div>

    <div class="jobs-list">
      <div id="agentMessage" style="
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
            border: 1px solid #334155;
          "></div>
      <div id="jobsContainer">
        <div class="status-message">Loading opportunities...</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Get HTML Elements (Declared Only Once)
    const aiPromptInput = document.getElementById("aiPromptInput");
    const askAgentBtn = document.getElementById("askAgentBtn");
    const jobsContainer = document.getElementById("jobsContainer");
    const agentMessage = document.getElementById("agentMessage");

    // 2. Fetch Data from Python Backend AI Agent
    // Use local backend for localhost; otherwise use deployed Vercel backend
    const DEPLOYED_BACKEND = "https://hacker-2t6h3vhn1-aihack.vercel.app";
    const backendBaseUrl = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://127.0.0.1:8800" : DEPLOYED_BACKEND;

    function getFallbackJobs(userQuery) {
      const query = (userQuery || "").toLowerCase();
      const fallbackJobs = [
        {
          company: "GOOGLE",
          title: "Software Engineer",
          type: "Job",
          domain: "Technology",
          ribbonText: "Featured",
          ribbonClass: "",
          apply_link: "https://careers.google.com/",
        },
        {
          company: "MICROSOFT",
          title: "Product Manager Intern",
          type: "Internship",
          domain: "Product",
          ribbonText: "Internship",
          ribbonClass: "intern",
          apply_link: "https://careers.microsoft.com/",
        },
        {
          company: "MLH",
          title: "Global Hackathon Season",
          type: "Hackathon",
          domain: "Build",
          ribbonText: "Register Now",
          ribbonClass: "hackathon",
          apply_link: "https://mlh.io/",
        },
        {
          company: "OPENAI",
          title: "Research Engineer",
          type: "Job",
          domain: "AI",
          ribbonText: "High Demand",
          ribbonClass: "",
          apply_link: "https://openai.com/careers/",
        },
      ];

      if (query.includes("hackathon") || query.includes("contest")) {
        return [fallbackJobs[2], fallbackJobs[0], fallbackJobs[3]];
      }

      if (query.includes("intern")) {
        return [fallbackJobs[1], fallbackJobs[0], fallbackJobs[3]];
      }

      if (query.includes("backend")) {
        return [{ ...fallbackJobs[0], title: "Backend Developer" }];
      }

      if (query.includes("frontend")) {
        return [{ ...fallbackJobs[0], title: "Frontend Developer" }];
      }

      if (query.includes("data") || query.includes("ai") || query.includes("ml")) {
        return [{ ...fallbackJobs[3], title: "AI / ML Engineer" }];
      }

      if (query.includes("cyber")) {
        return [{ ...fallbackJobs[0], title: "Cybersecurity Analyst" }];
      }

      if (query.includes("teacher") || query.includes("teaching")) {
        return [
          {
            company: "LOCAL SCHOOLS",
            title: "Teacher",
            type: "Job",
            domain: "Education",
            ribbonText: "Apply",
            ribbonClass: "",
            apply_link: "https://www.indeed.com/q-teacher-jobs.html",
          },
        ];
      }

      return fallbackJobs;
    }

    async function fetchAgentJobs() {
      jobsContainer.innerHTML =
        '<div class="status-message">🤖 AI Agent is thinking and analyzing your request...</div>';
      agentMessage.style.display = "none";

      const userQuery = aiPromptInput.value.trim() || "Software Engineer";

      try {
        const response = await fetch(
          `${backendBaseUrl}/api/jobs?prompt=${encodeURIComponent(userQuery)}`,
        );

        if (!response.ok) {
          throw new Error("Backend connection failed");
        }

        const data = await response.json();
        const opportunities = Array.isArray(data) ? data : [];

        agentMessage.innerText = `🤖 Agent: I analyzed your prompt and found ${opportunities.length} opportunities matching your request!`;
        agentMessage.style.display = "block";
        displayJobs(opportunities);
      } catch (error) {
        const fallbackData = getFallbackJobs(userQuery);
        agentMessage.innerText = `🤖 Agent: Backend unavailable, showing suggested opportunities for "${userQuery}".`;
        agentMessage.style.display = "block";
        displayJobs(fallbackData);
      }
    }

    // 3. Draw the cards on the screen
    function displayJobs(jobs) {
      jobsContainer.innerHTML = "";

      if (jobs.length === 0) {
        jobsContainer.innerHTML = `<div class="status-message">No matching opportunities found right now.</div>`;
        return;
      }

      for (let i = 0; i < jobs.length; i++) {
        let job = jobs[i];

        let cardHTML = `
            <div class="job-card">
                <div class="company-name">${job.company}</div>
                <div class="job-title">${job.title}</div>
                <span class="ribbon ${job.ribbonClass}">${job.ribbonText}</span>
                <button class="apply-btn" data-link="${job.apply_link}" data-company="${job.company}" data-title="${job.title}">Apply Now</button>
            </div>
        `;

        jobsContainer.innerHTML += cardHTML;
      }

      // Attach a single event listener for Apply buttons (delegation)
      jobsContainer.onclick = function (e) {
        const btn = e.target.closest && e.target.closest('.apply-btn');
        if (!btn) return;
        const link = btn.getAttribute('data-link');
        const company = btn.getAttribute('data-company');
        const title = btn.getAttribute('data-title');

        // Track application attempt (fire-and-forget), then open link
        fetch(`${backendBaseUrl}/api/track_apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company, title, apply_link: link })
        }).catch(() => { });

        if (link) window.open(link, '_blank');
      };
    }

    // 4. Event Listeners & Initial Load
    askAgentBtn.addEventListener("click", fetchAgentJobs);
    fetchAgentJobs();
  </script>
</body>

</html>
